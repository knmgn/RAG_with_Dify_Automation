app:
  description: Answers Demo Logistics Inc. policy questions and delivers the expense
    report template. Policy Q&A uses Hybrid Search with Weighted Score; file requests
    go through an n8n webhook.
  icon: 🚚
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: advanced-chat
  name: Demo-Logi-Bot (Internal Policy Assistant)
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/openai:1.0.0@c645d52efece517b10435f28da529156a86050dfa28fc4fde8089c038eee7f5a
    version: null
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables:
  - description: Shared secret for the n8n webhook Header Auth credential.
    id: 01a64b37-e19e-4240-a1d5-0e52e0669104
    name: N8N_WEBHOOK_TOKEN
    selector:
    - env
    - N8N_WEBHOOK_TOKEN
    value: ''
    value_type: secret
  features:
    file_upload:
      allowed_file_types: []
      enabled: false
      number_limits: 0
    opening_statement: Hi, I'm Demo-Logi-Bot, the internal policy assistant for Demo
      Logistics Inc. Ask me about travel, expense reimbursement and HR procedures.
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - How much can I claim for a late-night ride home?
    - When is the expense report deadline?
    - Send me the expense report template.
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: question-classifier
      id: start-source-intent_classifier-target
      source: start
      sourceHandle: source
      target: intent_classifier
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: question-classifier
        targetType: knowledge-retrieval
      id: intent_classifier-1-kb_retrieval-target
      source: intent_classifier
      sourceHandle: '1'
      target: kb_retrieval
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: question-classifier
        targetType: http-request
      id: intent_classifier-2-n8n_webhook-target
      source: intent_classifier
      sourceHandle: '2'
      target: n8n_webhook
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: knowledge-retrieval
        targetType: llm
      id: kb_retrieval-source-llm_answerer-target
      source: kb_retrieval
      sourceHandle: source
      target: llm_answerer
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: answer
      id: llm_answerer-source-final_answer-target
      source: llm_answerer
      sourceHandle: source
      target: final_answer
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: http-request
        targetType: code
      id: n8n_webhook-source-parse_response-target
      source: n8n_webhook
      sourceHandle: source
      target: parse_response
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: answer
      id: parse_response-source-file_answer-target
      source: parse_response
      sourceHandle: source
      target: file_answer
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: ''
        selected: false
        title: Start
        type: start
        variables: []
      height: 120
      id: start
      position:
        x: 30
        y: 300
      positionAbsolute:
        x: 30
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        classes:
        - id: '1'
          name: Policy Q&A
        - id: '2'
          name: File request
        desc: ''
        instruction: 'Classify the user''s message into one of the following two classes.


          [Class 1: Policy Q&A]

          - Questions about what the policy says

          - Examples: "What is the cap for a late-night ride home?", "When is the
          expense report deadline?", "How is the night shift differential calculated?"


          [Class 2: File request]

          - Requests to send or download the expense report template or form

          - Examples: "Send me the expense report template", "I need the template
          link", "Can you send me the Excel file?"


          If the classification is ambiguous, choose [Class 1: Policy Q&A].'
        model:
          completion_params:
            temperature: 0
          mode: chat
          name: gpt-4o-mini
          provider: langgenius/openai/openai
        query_variable_selector:
        - sys
        - query
        selected: false
        title: Intent classifier
        type: question-classifier
        vision:
          enabled: false
      height: 120
      id: intent_classifier
      position:
        x: 330
        y: 300
      positionAbsolute:
        x: 330
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        dataset_ids:
        - 9433puo0PZBKpOdseJvxnzRTMCiCt2j3o3noI0Jh9W2EYIdwdwDrFENSyI2I6/6U
        desc: ''
        metadata_filtering_mode: disabled
        multiple_retrieval_config:
          reranking_enable: false
          reranking_mode: weighted_score
          score_threshold: 0.3
          top_k: 4
          weights:
            keyword_setting:
              keyword_weight: 0.3
            vector_setting:
              embedding_model_name: text-embedding-3-large
              embedding_provider_name: langgenius/openai/openai
              vector_weight: 0.7
            weight_type: customized
        query_variable_selector:
        - sys
        - query
        retrieval_mode: multiple
        selected: false
        title: Knowledge retrieval
        type: knowledge-retrieval
        vision:
          enabled: false
      height: 120
      id: kb_retrieval
      position:
        x: 650
        y: 180
      positionAbsolute:
        x: 650
        y: 180
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: true
          variable_selector:
          - kb_retrieval
          - result
        desc: ''
        model:
          completion_params:
            temperature: 0
          mode: chat
          name: gpt-4o-mini
          provider: langgenius/openai/openai
        prompt_config:
          jinja2_variables: []
        prompt_template:
        - edition_type: basic
          role: system
          text: "# Role\nYou are \"Demo-Logi-Bot\", the internal policy assistant\
            \ for Demo Logistics Inc.\nYou answer employee questions about travel,\
            \ expenses and HR procedures accurately, based on the internal policy\
            \ (DL-HR-RG-2024-007).\n\n# Non-negotiable rules\n1. Always base your\
            \ answer on the knowledge inside the <context> tag (the policy text).\n\
            2. If <context> does not contain the answer, or its relevance is low,\
            \ NEVER fill the gap with guesses, assumptions or general knowledge. Instead,\
            \ reply with exactly this message:\n\n   \"No explicit provision covering\
            \ your question was found in the internal policy (DL-HR-RG-2024-007).\
            \ Please contact People Operations directly (ext. 1234 / people-ops@demo-logistics.example.com).\"\
            \n\n3. Even when asked about general legal, tax or employment matters,\
            \ use the message above unless the internal policy addresses the point\
            \ directly. General explanations such as \"Under the FLSA...\" or \"The\
            \ IRS generally...\" are prohibited.\n4. Quote amounts, deadlines and\
            \ conditions from <context> exactly as written, without rewording (e.g.\
            \ write \"USD 100 per ride (tax and tip included)\" word for word).\n\
            5. If the user asks for an exception or a change to the rules (e.g. \"\
            Can you make an exception for me?\"), state that you have no authority\
            \ to decide and direct them to People Operations.\n\n# Answer format (mandatory)\n\
            Structure every answer in these three blocks:\n\n**Answer**\n(A direct\
            \ answer in 1-3 sentences. List any amounts, conditions and deadlines\
            \ as bullet points.)\n\n**Details**\n(Supporting explanation based on\
            \ the relevant article. Always mention prohibited cases or exceptions\
            \ if there are any.)\n\n**Source**\n- Policy: Demo Logistics Inc. Travel,\
            \ Expense Reimbursement and HR Procedures Policy (DL-HR-RG-2024-007)\n\
            - Section: Article X, Clause/Paragraph X (topic)\n- Last revised: October\
            \ 1, 2024 (Revision 3)\n\n# Tone and style\n- Polite, concise business\
            \ English.\n- No unnecessary preamble (such as \"Thank you for your question\"\
            ).\n- No emoji.\n\n# Prohibited\n- Amounts, deadlines, names or departments\
            \ that are not grounded in the knowledge\n- Reusing earlier answers instead\
            \ of consulting the knowledge each time\n- Hedging language such as \"\
            probably\", \"generally\" or \"I think\"\n- Inventing policy numbers or\
            \ article numbers\n\n# Input\nUser question: {{#sys.query#}}\n\nReference\
            \ knowledge:\n<context>\n{{#context#}}\n</context>"
        - edition_type: basic
          role: user
          text: '{{#sys.query#}}'
        selected: false
        title: Answer generation
        type: llm
        vision:
          enabled: false
      height: 120
      id: llm_answerer
      position:
        x: 960
        y: 180
      positionAbsolute:
        x: 960
        y: 180
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        answer: '{{#llm_answerer.text#}}'
        desc: ''
        selected: false
        title: Answer
        type: answer
      height: 120
      id: final_answer
      position:
        x: 1270
        y: 180
      positionAbsolute:
        x: 1270
        y: 180
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data:
          - key: ''
            type: text
            value: "{\n  \"intent\": \"request_expense_template\",\n  \"user_id\"\
              : \"{{#sys.user_id#}}\",\n  \"user_query\": \"{{#sys.query#}}\",\n \
              \ \"conversation_id\": \"{{#sys.conversation_id#}}\",\n  \"requested_at\"\
              : \"{{#sys.timestamp#}}\",\n  \"metadata\": {\n    \"source\": \"dify-chatflow\"\
              ,\n    \"template_key\": \"expense_template_v3\"\n  }\n}"
          type: json
        desc: ''
        headers: 'Content-Type:application/json

          X-Auth-Token:{{#env.N8N_WEBHOOK_TOKEN#}}'
        method: post
        params: ''
        retry_config:
          max_retries: 2
          retry_enabled: true
          retry_interval: 1000
        selected: false
        ssl_verify: false
        timeout:
          connect: 10
          read: 10
          write: 10
        title: n8n Webhook
        type: http-request
        url: http://n8n_local:5678/webhook/8ee2e0e7-1aa3-4c37-9444-47c34dd9d509
      height: 120
      id: n8n_webhook
      position:
        x: 650
        y: 470
      positionAbsolute:
        x: 650
        y: 470
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: "import json\n\n\ndef main(body: str) -> dict:\n    \"\"\"Turn Workflow\
          \ 1's JSON response into named workflow variables.\"\"\"\n    data = json.loads(body)\
          \ if body else {}\n    keys = (\"message\", \"filename\", \"download_url\"\
          , \"deadline\", \"macro_warning\", \"regulation_ref\")\n    return {key:\
          \ str(data.get(key, \"\")) for key in keys}\n"
        code_language: python3
        desc: ''
        outputs:
          deadline:
            type: string
          download_url:
            type: string
          filename:
            type: string
          macro_warning:
            type: string
          message:
            type: string
          regulation_ref:
            type: string
        selected: false
        title: Parse response
        type: code
        variables:
        - value_selector:
          - n8n_webhook
          - body
          variable: body
      height: 120
      id: parse_response
      position:
        x: 960
        y: 470
      positionAbsolute:
        x: 960
        y: 470
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        answer: '{{#parse_response.message#}}


          📎 **{{#parse_response.filename#}}**

          {{#parse_response.download_url#}}


          **Please note**

          - Deadline: {{#parse_response.deadline#}}

          - {{#parse_response.macro_warning#}}


          **Source**

          Policy: {{#parse_response.regulation_ref#}}

          Contacts: People Operations (ext. 1234) / Accounts Payable (ext. 1456)'
        desc: ''
        selected: false
        title: File answer
        type: answer
      height: 120
      id: file_answer
      position:
        x: 1270
        y: 470
      positionAbsolute:
        x: 1270
        y: 470
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 0.7
  rag_pipeline_variables: []
